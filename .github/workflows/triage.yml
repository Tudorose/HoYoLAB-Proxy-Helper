name: Triage Agent

# AI 问题分诊：issue / PR 打开、评论、以及每日兜底扫描时自动分类并打标签。
# 需要 Repo Secret: AI_API_KEY；可选 Variables: AI_BASE_URL、AI_MODEL。

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review]
  schedule:
    - cron: '17 2 * * *' # 每天 10:17 (Asia/Shanghai) 兜底扫描未分诊条目
  workflow_dispatch:
    inputs:
      issue_number:
        description: '要分诊的 issue / PR 编号（留空 = 扫描全部未分诊条目）'
        required: false
        type: string
      dry_run:
        description: '只输出计划，不写标签/评论'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  models: read

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  triage:
    # 跳过机器人评论，以及 Agent 自己的评论（避免自触发循环）
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'issues' ||
        github.event_name == 'pull_request_target' ||
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.type != 'Bot' &&
          !contains(github.event.comment.body, 'triage-agent'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 解析目标条目
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          args=""
          skip="false"
          case "$EVENT_NAME" in
            issues)
              args="--number $ISSUE_NUMBER"
              ;;
            issue_comment)
              if [ "$IS_PR" = "true" ]; then
                args="--number $ISSUE_NUMBER --kind pr"
              else
                args="--number $ISSUE_NUMBER"
              fi
              ;;
            pull_request_target)
              if [ "$PR_AUTHOR" = "$REPO_OWNER" ]; then
                skip="true" # 维护者自己的 PR 不需要分诊
              else
                args="--number $PR_NUMBER --kind pr"
              fi
              ;;
            schedule)
              args="--all"
              ;;
            workflow_dispatch)
              if [ -n "${INPUT_NUMBER}" ]; then args="--number ${INPUT_NUMBER}"; else args="--all"; fi
              ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "将执行: node .github/triage/triage.mjs $args"

      - name: 运行分诊 Agent
        if: steps.target.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Variables 优先，其次 Secrets —— 两个分区都可以放
          AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
          TRIAGE_DRY_RUN: ${{ (inputs.dry_run == true) && 'true' || 'false' }}
        run: |
          node .github/triage/triage.mjs ${{ steps.target.outputs.args }} \
            --summary-file "$GITHUB_STEP_SUMMARY"